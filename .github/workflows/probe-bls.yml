name: Probe BLS access
on:
  push:
    branches: [probe/bls-access]
jobs:
  current_agent:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSf -o /dev/null -A "RecoveryLens/0.1 (public-data research)" https://download.bls.gov/pub/time.series/cu/cu.data.1.AllItems
  contact_agent:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSf -o /dev/null -A "RecoveryLens/0.1 (https://github.com/Boatengs/recoverylens; noreply@github.com)" https://download.bls.gov/pub/time.series/cu/cu.data.1.AllItems
  python_requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -e . && python -c "from recoverylens.context import acquire; from pathlib import Path; print(acquire('https://download.bls.gov/pub/time.series/cu/cu.data.1.AllItems', Path('cpi/x')))"
